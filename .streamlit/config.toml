[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
chartCategoricalColors = ["#4F46E5", "#0F9F8F", "#E6A23C", "#D85A76", "#65758B"]
font = "sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.sidebar]
backgroundColor = "#111827"
secondaryBackgroundColor = "#1F2937"
textColor = "#F8FAFC"
borderColor = "#293548"
primaryColor = "#A5B4FC"
